name: Auto Post Images to Facebook

on:
  schedule:
    # Run every 6 hours (adjust as needed)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'enterprise'
        type: choice
        options:
          - basic
          - enterprise

jobs:
  post-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run automation
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          ARCHIVE_SOURCES: ${{ secrets.ARCHIVE_SOURCES }}
          MIN_POST_INTERVAL_HOURS: ${{ secrets.MIN_POST_INTERVAL_HOURS }}
          MAX_POST_INTERVAL_HOURS: ${{ secrets.MAX_POST_INTERVAL_HOURS }}
          MAX_IMAGES_PER_POST: ${{ secrets.MAX_IMAGES_PER_POST }}
          CREDIT_TEXT: ${{ secrets.CREDIT_TEXT }}
          DISCLAIMER_TEXT: ${{ secrets.DISCLAIMER_TEXT }}
          GITHUB_ACTIONS: "true"
          MIN_IMAGE_WIDTH: "400"
          MIN_IMAGE_HEIGHT: "300"
          MIN_IMAGE_SIZE_KB: "10"
        run: |
          cd src
          python automation.py
