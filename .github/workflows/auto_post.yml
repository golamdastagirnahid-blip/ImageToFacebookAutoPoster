name: Auto Post Images to Facebook

on:
  schedule:
    # 8 posts/day at natural (non-robotic) times in UTC
    # Each run adds its own 0-45min random delay so actual post times vary
    - cron: '17 1 * * *'    # ~morning (varies 1:17-2:02 UTC)
    - cron: '43 4 * * *'    # ~late morning
    - cron: '22 7 * * *'    # ~midday
    - cron: '51 10 * * *'   # ~afternoon
    - cron: '8 13 * * *'    # ~late afternoon
    - cron: '37 16 * * *'   # ~evening
    - cron: '14 19 * * *'   # ~night
    - cron: '49 22 * * *'   # ~late night
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'enterprise'
        type: choice
        options:
          - basic
          - enterprise

permissions:
  contents: write  # Required to commit posted-images database back

jobs:
  post-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Restore posted-images database
        uses: actions/cache@v4
        with:
          path: |
            data/image_database.db
            data/nsfw_detector.db
          key: posted-db-${{ github.run_id }}
          restore-keys: |
            posted-db-
      
      - name: Move databases to src directory
        run: |
          mkdir -p data
          if [ -f data/image_database.db ]; then cp data/image_database.db src/; fi
          if [ -f data/nsfw_detector.db ]; then cp data/nsfw_detector.db src/; fi
      
      - name: Random human-like startup delay
        run: |
          # PAUSED FOR TESTING - Re-enable later for humanization
          # DELAY=$((RANDOM % 2700))
          # echo "Waiting ${DELAY} seconds before posting..."
          # sleep $DELAY
          echo "Random delay PAUSED for testing - posting immediately"
      
      - name: Run automation
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          ARCHIVE_SOURCES: ${{ secrets.ARCHIVE_SOURCES }}
          MIN_POST_INTERVAL_HOURS: ${{ secrets.MIN_POST_INTERVAL_HOURS }}
          MAX_POST_INTERVAL_HOURS: ${{ secrets.MAX_POST_INTERVAL_HOURS }}
          CREDIT_TEXT: ${{ secrets.CREDIT_TEXT }}
          DISCLAIMER_TEXT: ${{ secrets.DISCLAIMER_TEXT }}
          GITHUB_ACTIONS: "true"
          # Scrape-time validation is on archive.org THUMBNAILS (always ~180px)
          # Real quality check happens later on the downloaded high-res image
          MIN_IMAGE_WIDTH: "100"
          MIN_IMAGE_HEIGHT: "100"
          MIN_IMAGE_SIZE_KB: "1"
          MAX_IMAGE_SIZE_MB: "30"
          # High-res quality enforced in automation.py (600x400 minimum)
          MIN_HIRES_WIDTH: "600"
          MIN_HIRES_HEIGHT: "400"
          MAX_IMAGES_PER_POST: "1"
          MAX_PAGES_PER_SOURCE: "1"
          NSFW_STRICT_MODE: "true"
          BLOCK_ON_MEDIUM_RISK: "true"
        run: |
          cd src
          python automation.py
      
      - name: Save databases for next run
        if: always()
        run: |
          mkdir -p data
          if [ -f src/image_database.db ]; then cp src/image_database.db data/; fi
          if [ -f src/nsfw_detector.db ]; then cp src/nsfw_detector.db data/; fi
      
      - name: Commit updated database
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/image_database.db data/nsfw_detector.db 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update posted-images database [skip ci]"
          git push || echo "Nothing to push"
